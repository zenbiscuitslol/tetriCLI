[package]
name = "tetriscli"
version = "0.1.0"
edition = "2021"
authors = ["tetriCLI"]
description = "A polished terminal-based Tetris clone written in Rust."
license = "MIT"

[dependencies]
crossterm = "0.27"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true